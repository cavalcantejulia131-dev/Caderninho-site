<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Caderninho da Doutora</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pk:#ec4899;--pk1:#ffe8f3;--pk2:#fecfe8;--pk3:#fba8d4;--pkd:#be185d;
  --gold:#f59e0b;--goldl:#fde68a;--goldb:#fffbeb;
  --mint:#34d399;--mintl:#bbf7d0;
  --sky:#38bdf8;--skyl:#bae6fd;
  --lav:#a78bfa;--lavl:#ddd6fe;
  --red:#ef4444;--redl:#fee2e2;
  --tx:#4a1230;--mu:#b87898;--soft:#d4a0b8;--wh:#fff;--bd:#fecfe8;
  --r:16px;--sh:0 2px 12px rgba(236,72,153,.09);--sh2:0 6px 28px rgba(236,72,153,.17);
}
body{font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5;background:#ffd6e8;color:var(--tx);min-height:100vh;overflow-x:hidden}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
.app{position:relative;z-index:1;display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:210px;flex-shrink:0;background:linear-gradient(180deg,#fff0f8,#fde8f5);border-right:1.5px solid var(--bd);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100}
.sb-top{text-align:center;padding:20px 12px 14px;border-bottom:1.5px solid var(--bd)}
.sb-top h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:var(--pk);line-height:1.25;margin-top:7px}
.sem-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#ffe0f0,#ffd6e8);border:2px solid var(--pk2);border-radius:50px;padding:4px 11px 4px 8px;margin-top:7px;cursor:pointer;transition:box-shadow .18s,transform .18s;box-shadow:0 2px 8px rgba(236,72,153,.12)}
.sem-badge:hover{box-shadow:0 4px 14px rgba(236,72,153,.24);transform:translateY(-1px)}
.sem-badge span{font-size:.74rem;font-weight:700;color:var(--pkd)}
.sem-edit{display:none;padding:6px 10px 0}
.sem-edit.open{display:block}
.sem-edit input{width:100%;border:1.5px solid var(--pk2);border-radius:10px;padding:5px 9px;font-size:.8rem;color:var(--tx);background:white;outline:none;text-align:center;margin-bottom:5px}
.sem-edit input:focus{border-color:var(--pk)}
.sem-btns{display:flex;gap:5px}
.nav-list{padding:7px;flex:1}
.nav-item{display:flex;align-items:center;padding:9px 12px;border-radius:11px;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--mu);transition:background .15s,color .15s;margin-bottom:2px;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--pk1);color:var(--pkd)}
.nav-item.active{background:linear-gradient(135deg,var(--pk2),var(--pk1));color:var(--pkd);font-weight:600}
.sb-foot{padding:11px;font-size:.66rem;color:var(--soft);text-align:center;line-height:1.7;border-top:1.5px solid var(--bd);flex-shrink:0}

/* MAIN */
.main{flex:1;margin-left:210px;padding:24px 20px 80px;max-width:900px;width:100%}

/* BOTTOM NAV */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1.5px solid var(--bd);z-index:200;padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
.bnav-inner{display:flex;overflow-x:auto;padding:0 4px;scrollbar-width:none}
.bnav-inner::-webkit-scrollbar{display:none}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 10px;cursor:pointer;border-radius:10px;min-width:52px;flex-shrink:0;transition:background .13s}
.bn-item.active{background:var(--pk1)}
.bn-label{font-size:.55rem;font-weight:600;color:var(--mu)}
.bn-item.active .bn-label{color:var(--pkd)}

/* PAGES */
.page{display:none;animation:fadeUp .3s ease both}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block}

/* PAGE HEADER */
.page-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.65rem;font-weight:600;color:var(--pk);margin-bottom:4px}
.page-sub{font-size:.77rem;color:var(--mu);margin-bottom:15px}

/* CARDS */
.card{background:var(--wh);border:1.5px solid var(--bd);border-radius:var(--r);padding:15px 17px;box-shadow:var(--sh)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;padding:8px 16px;border-radius:50px;border:none;cursor:pointer;transition:transform .13s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-pk{background:linear-gradient(135deg,var(--pk3),var(--pk));color:white;box-shadow:0 3px 12px rgba(236,72,153,.2)}
.btn-gh{background:white;color:var(--pk);border:1.5px solid var(--bd)}
.btn-sm{font-size:.73rem;padding:5px 12px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}

/* PROGRESS */
.prog{display:flex;align-items:center;gap:10px;background:white;border:1.5px solid var(--bd);border-radius:var(--r);padding:10px 14px;margin-bottom:13px;box-shadow:var(--sh)}
.prog-label{font-size:.73rem;font-weight:600;color:var(--mu);flex-shrink:0}
.prog-track{flex:1;height:9px;background:var(--pk1);border-radius:99px;overflow:hidden;min-width:28px}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pk3),var(--pk));transition:width .7s ease}
.prog-pct{font-size:.83rem;font-weight:700;color:var(--pk);flex-shrink:0;min-width:30px;text-align:right}

/* SECTION TITLE */
.sec-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:var(--pk);margin:14px 0 8px}

/* TASK GRID */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* TASK CARD */
.tc{background:white;border:1.5px solid var(--bd);border-radius:var(--r);padding:11px 11px 9px;cursor:pointer;position:relative;overflow:hidden;transition:transform .16s,box-shadow .16s,background .2s,opacity .2s;box-shadow:0 1px 5px rgba(236,72,153,.05)}
.tc:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--pk3)}
.tc.done{background:linear-gradient(135deg,#fff0f8,#fff8fd);opacity:.72}
.tc.done .tc-title{text-decoration:line-through;color:var(--soft)}
.tc-row{display:flex;gap:8px;align-items:flex-start}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);background:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.74rem;color:white;transition:all .2s}
.tc.done .chk{background:linear-gradient(135deg,var(--pk3),var(--pk));border-color:var(--pk);box-shadow:0 2px 8px rgba(236,72,153,.26)}
.tc-body{flex:1;min-width:0}
.tc-title{font-size:.83rem;font-weight:600;color:var(--tx);line-height:1.37;word-break:break-word;transition:color .2s}
.tc-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:.62rem;font-weight:600;padding:1px 6px;border-radius:99px;border:1.5px solid;white-space:nowrap;max-width:108px;overflow:hidden;text-overflow:ellipsis}
.t-time{background:#fff0f7;color:#b84070;border-color:#fbb8d0}
.t-type{background:#f0fbf5;color:#2a7a60;border-color:#a8e8cc}
.tc-actions{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.tc-btn{display:inline-flex;align-items:center;gap:3px;font-family:'DM Sans',sans-serif;font-size:.62rem;font-weight:600;padding:2px 7px;border-radius:99px;border:1.5px solid;cursor:pointer;background:white;transition:all .13s;white-space:nowrap}
.tc-btn-anki{color:#7a4010;border-color:var(--gold)}.tc-btn-anki:hover{background:var(--goldl)}
.tc-btn-anki.logged{color:#166534;border-color:var(--mint);background:#f0fdf4;cursor:default}
.tc-btn-quiz{color:#4c1d95;border-color:var(--lav);font-weight:700}.tc-btn-quiz:hover{background:var(--lavl)}
.tc-btn-note{color:#1060a0;border-color:var(--sky)}.tc-btn-note:hover{background:var(--skyl)}
.tc-btn-pomo{color:var(--pkd);border-color:var(--pk3)}.tc-btn-pomo:hover{background:var(--pk1)}

/* FIELDS */
.field{display:block;width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:7px 10px;font-family:'DM Sans',sans-serif;font-size:.84rem;color:var(--tx);background:#fff5f9;outline:none;transition:border-color .16s}
.field:focus{border-color:var(--pk);background:white}
textarea.field{resize:vertical;min-height:68px;line-height:1.5}
.frow{display:flex;gap:7px;margin-bottom:7px}
.frow .field{flex:1;margin-bottom:0}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(74,18,48,.2);backdrop-filter:blur(4px);z-index:999;align-items:center;justify-content:center;padding:13px}
.modal-bg.open{display:flex}
.modal{background:white;border-radius:20px;padding:20px 18px 16px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;border:2px solid var(--bd);box-shadow:var(--sh2);animation:fadeUp .23s ease both}
.modal-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.18rem;color:var(--pk);margin-bottom:12px}
.modal-foot{display:flex;gap:7px;justify-content:flex-end;margin-top:11px}

/* ROTINA */
.rot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.rot-card{background:white;border:1.5px solid var(--bd);border-left:4px solid var(--pk3);border-radius:var(--r);padding:11px 12px;box-shadow:var(--sh);display:flex;align-items:flex-start;gap:9px;transition:transform .15s}
.rot-card:hover{transform:translateY(-2px)}

/* QUIZ */
.quiz-config{background:#fff5f9;border:1.5px solid var(--bd);border-radius:var(--r);padding:14px 15px;margin-bottom:12px}
.config-label{font-size:.72rem;font-weight:700;color:var(--mu);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.chip{padding:5px 12px;border-radius:50px;border:1.5px solid var(--bd);background:white;color:var(--mu);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.chip:hover{border-color:var(--pk3);background:var(--pk1)}
.chip.active{border-color:var(--pk);background:var(--pk1);color:var(--pkd)}
.topic-input-row{display:flex;gap:8px;margin-bottom:7px}
.topic-chips{display:flex;gap:6px;flex-wrap:wrap;min-height:10px}
.topic-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:50px;background:var(--pk1);border:1.5px solid var(--pk);font-size:.78rem;color:var(--pkd);font-weight:600}
.topic-chip button{background:none;border:none;cursor:pointer;color:var(--pkd);font-size:.85rem;line-height:1;padding:0}
.gen-btn{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--pk3),var(--pk));color:white;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 4px 16px rgba(236,72,153,.3);font-family:'DM Sans',sans-serif}
.gen-btn:hover{filter:brightness(1.05)}
.gen-btn:disabled{opacity:.6;cursor:not-allowed}
.score-bar{display:flex;align-items:center;gap:12px;background:white;border-radius:14px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.q-block{background:white;border-radius:var(--r);padding:14px 15px;margin-bottom:10px;box-shadow:var(--sh)}
.q-num{font-size:.67rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.q-text{font-size:.9rem;font-weight:600;color:var(--tx);line-height:1.5;margin-bottom:10px}
.q-opts{display:flex;flex-direction:column;gap:6px}
.q-opt{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--bd);cursor:pointer;background:white;transition:all .15s;text-align:left;line-height:1.45;font-size:.85rem;color:var(--tx);width:100%;font-family:'DM Sans',sans-serif}
.q-opt:hover:not([disabled]){background:var(--pk1);border-color:var(--pk3)}
.q-opt.correct{background:var(--mintl);border-color:var(--mint);color:#166534}
.q-opt.wrong{background:var(--redl);border-color:#fca5a5;color:#b91c1c}
.q-opt.rev{background:var(--mintl);border-color:var(--mint);color:#166534;opacity:.7}
.q-expl{margin-top:9px;font-size:.79rem;font-style:italic;color:var(--tx);background:var(--lavl);border-left:3px solid var(--lav);border-radius:0 10px 10px 0;padding:8px 11px;line-height:1.55;display:none}
.q-expl.show{display:block}
.quiz-result{background:linear-gradient(135deg,var(--pk1),#fff0f8);border:2px solid var(--pk2);border-radius:var(--r);padding:22px;text-align:center;margin-top:12px;box-shadow:var(--sh2)}
.qr-score{font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:600;color:var(--pk);line-height:1}

/* POMODORO */
.pomo-card{background:white;border:1.5px solid var(--bd);border-radius:var(--r);padding:22px 15px;margin-bottom:12px;text-align:center;box-shadow:var(--sh);transition:border-color .3s}
.pomo-card.focus-mode{border-color:var(--pk3);box-shadow:0 0 0 4px rgba(236,72,153,.07)}
.pomo-card.break-mode{border-color:var(--mint)}

/* EXAMS */
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:8px;margin-bottom:16px}

/* GRADE TABLE */
.grade-table{width:100%;border-collapse:collapse;margin-bottom:11px;font-size:.81rem}
.grade-table th{background:var(--pk1);color:var(--pkd);font-weight:600;padding:6px 8px;text-align:left;font-size:.73rem}
.grade-table td{padding:6px 8px;border-bottom:1px solid var(--pk1)}
.grade-table input{border:1.5px solid var(--bd);border-radius:7px;padding:3px 5px;font-size:.79rem;color:var(--tx);background:#fff5f9;outline:none;font-family:'DM Sans',sans-serif}
.grade-table input:focus{border-color:var(--pk);background:white}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-bottom:16px}
.stat-card{background:white;border:1.5px solid var(--bd);border-radius:var(--r);padding:11px 9px;text-align:center;box-shadow:var(--sh)}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:1.75rem;font-weight:600;color:var(--pk);line-height:1}
.stat-lbl{font-size:.67rem;color:var(--mu);margin-top:2px}

/* NOTES */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}

/* HEATMAP */
.hm-scroll{overflow-x:auto;padding-bottom:5px}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}

/* TOAST */
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--goldb),var(--goldl));border:2px solid var(--gold);border-radius:12px;padding:9px 18px;text-align:center;box-shadow:0 5px 20px rgba(245,158,11,.2);z-index:9998;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;font-size:.81rem;white-space:nowrap;max-width:290px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MOTIV BANNER */
.motiv{background:linear-gradient(135deg,#fff0f8,#fde8f5);border:1.5px solid var(--pk2);border-radius:var(--r);padding:11px 14px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.motiv::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pk3),var(--pk),var(--pk3))}

/* ANKI PILLS */
.sr-pills{display:flex;gap:3px;flex-wrap:wrap}
.sr-pill{font-size:.61rem;font-weight:700;padding:2px 6px;border-radius:99px;border:1.5px solid;cursor:default}
.sr-pill.fu{background:#f5f5f5;color:#bbb;border-color:#e0e0e0}
.sr-pill.du{background:var(--goldl);color:#7a4010;border-color:var(--gold);cursor:pointer}
.sr-pill.ov{background:var(--redl);color:#b91c1c;border-color:#fca5a5;cursor:pointer}
.sr-pill.dn{background:var(--mintl);color:#166534;border-color:var(--mint)}

/* WRONG QUEUE */
.wrong-card{background:white;border:1.5px solid var(--bd);border-left:4px solid var(--red);border-radius:var(--r);padding:11px 12px;box-shadow:var(--sh);margin-bottom:8px}

@media(max-width:680px){
  .sidebar{display:none}
  .bnav{display:block}
  .main{margin-left:0;padding:12px 10px 90px;max-width:100%}
  .tgrid{grid-template-columns:1fr}
  .rot-grid{grid-template-columns:1fr}
  .exam-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:400px){.exam-grid{grid-template-columns:1fr}}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--pk1)}
::-webkit-scrollbar-thumb{background:var(--pk3);border-radius:99px}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="toast" id="toast"></div>

<div class="app">
<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sb-top">
    <svg width="68" height="40" viewBox="0 0 90 52" fill="none">
      <path d="M44 26 C36 13,10 7,5 18 C1 25,8 35,21 32 C31 30,40 28,44 26Z" fill="#fba8d4" opacity=".95"/>
      <path d="M44 26 C38 17,16 11,9 20 C5 26,11 32,22 30 C33 28,41 27,44 26Z" fill="#fde8f5" opacity=".5"/>
      <path d="M46 26 C54 13,80 7,85 18 C89 25,82 35,69 32 C59 30,50 28,46 26Z" fill="#fba8d4" opacity=".95"/>
      <path d="M46 26 C52 17,74 11,81 20 C85 26,79 32,68 30 C57 28,49 27,46 26Z" fill="#fde8f5" opacity=".5"/>
      <path d="M42 29 Q33 43,26 49" stroke="#fba8d4" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M48 29 Q57 43,64 49" stroke="#fba8d4" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M42 29 Q32 45,24 51" stroke="#fde8f5" stroke-width="1.8" stroke-linecap="round" opacity=".6"/>
      <path d="M48 29 Q58 45,66 51" stroke="#fde8f5" stroke-width="1.8" stroke-linecap="round" opacity=".6"/>
      <ellipse cx="45" cy="26" rx="7.5" ry="7.5" fill="#ec4899"/>
      <ellipse cx="45" cy="26" rx="4.5" ry="4.5" fill="#fce7f3" opacity=".4"/>
    </svg>
    <h2>Caderninho<br>da Doutora</h2>
    <div class="sem-badge" onclick="toggleSem()">
      <span id="semTxt">1o Semestre</span>
      <span style="font-size:.68rem;opacity:.5">editar</span>
    </div>
    <div class="sem-edit" id="semEdit">
      <input id="semInput" placeholder="Ex: 2o Semestre 2025" maxlength="30"
        onkeydown="if(event.key==='Enter')saveSem();if(event.key==='Escape')cancelSem();">
      <div class="sem-btns">
        <button class="btn btn-pk btn-sm" onclick="saveSem()" style="flex:1">OK</button>
        <button class="btn btn-gh btn-sm" onclick="cancelSem()" style="flex:1">X</button>
      </div>
    </div>
  </div>
  <div class="nav-list" id="navList"></div>
  <div class="sb-foot">feito com amor para a futura medica</div>
</nav>

<main class="main" id="mainContent"></main>
</div>

<!-- BOTTOM NAV -->
<nav class="bnav">
  <div class="bnav-inner" id="bnavInner"></div>
</nav>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const DAYS = ["Segunda","Terca","Quarta","Quinta","Sexta","Sabado","Domingo"];
const DAY_PT = {Segunda:"Segunda-feira",Terca:"Terca-feira",Quarta:"Quarta-feira",Quinta:"Quinta-feira",Sexta:"Sexta-feira",Sabado:"Sabado",Domingo:"Domingo"};
const DAYNUM = {Segunda:1,Terca:2,Quarta:3,Quinta:4,Sexta:5,Sabado:6,Domingo:0};
const SR = [1,3,7,14,30];
const SUBJS = ["Anatomia","Bioquimica","Fisiologia","Histologia","Embriologia","Biofisica","Geral"];
const SCOL = {Anatomia:"#fba8d4",Bioquimica:"#c4b5fd",Fisiologia:"#6ee7b7",Histologia:"#fcd34d",Embriologia:"#93c5fd",Biofisica:"#f9a8d4",Geral:"#e2e8f0"};
const sCol = s => { for(const k in SCOL) if(s&&s.toLowerCase().includes(k.toLowerCase())) return SCOL[k]; return "#fecfe8"; };
const todayStr = () => new Date().toISOString().split("T")[0];
const NAV = [
  {id:"cronograma",label:"Cronograma"},
  {id:"rotina",label:"Rotina"},
  {id:"hoje",label:"Hoje"},
  {id:"quiz",label:"Quiz IA"},
  {id:"progresso",label:"Progresso"},
  {id:"pomodoro",label:"Pomodoro"},
  {id:"provas",label:"Provas"},
  {id:"notas",label:"Notas"},
  {id:"anki",label:"Anki"},
  {id:"conquistas",label:"Conquistas"},
  {id:"historico",label:"Historico"},
];

// ─── ACHIEVEMENTS ──────────────────────────────────────────────────────────
function checkAch() {
  const dc = Object.values(done).filter(Boolean).length;
  let strk=0; const dt=new Date(); dt.setHours(0,0,0,0);
  while(true){const ds=dt.toISOString().split("T")[0];if(studyLog[ds]&&studyLog[ds]>0){strk++;dt.setDate(dt.getDate()-1);}else break;}
  const checks = {
    first:dc>=1, ten:dc>=10, str3:strk>=3, str7:strk>=7,
    anki1:ankiLogs.length>=1, pomo1:pomoSess.filter(s=>s.tp==="focus").length>=1,
    note1:notes.length>=1, rot1:rotina.length>=1,
    quiz1:quizDone>=1, quizp:quizPerf>=1,
    full:tasks.length>0&&dc===tasks.length
  };
  let changed=false;
  ACH_DEF.forEach(a=>{ if(!unlockedAch.has(a.id)&&checks[a.id]){unlockedAch.add(a.id);changed=true;showToast("Conquista: "+a.name+" desbloqueada!");} });
  if(changed) save();
}

function toggleDone(id) {
  const td = todayStr();
  done[id] = !done[id];
  if(done[id]) studyLog[td] = (studyLog[td]||0)+1;
  else { studyLog[td] = Math.max(0,(studyLog[td]||1)-1); if(!studyLog[td]) delete studyLog[td]; }
  save(); checkAch(); render();
}

function buildTC(task, editable) {
  const isDone = !!done[task.id];
  const isLogged = ankiLogs.some(l=>l.taskId===task.id);
  const hasNote = !!(tNotes[task.id]&&tNotes[task.id].trim());
  const col = sCol(task.subj);

  if(editable) {
    return `<div class="card" style="padding:11px">
      <input class="field" value="${esc(task.title)}" oninput="updTask(${task.id},'title',this.value)" placeholder="Titulo" style="margin-bottom:6px">
      <div class="frow">
        <select class="field" onchange="updTask(${task.id},'day',this.value)">${DAYS.map(d=>`<option${d===task.day?" selected":""}>${d}</option>`).join("")}</select>
        <input class="field" value="${esc(task.time)}" oninput="updTask(${task.id},'time',this.value)" placeholder="Horario">
      </div>
      <div class="frow">
        <input class="field" value="${esc(task.subj)}" oninput="updTask(${task.id},'subj',this.value)" placeholder="Materia">
        <input class="field" value="${esc(task.type)}" oninput="updTask(${task.id},'type',this.value)" placeholder="Tipo">
      </div>
      <label style="display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--mu);cursor:pointer;margin-bottom:7px">
        <input type="checkbox" ${task.anki?"checked":""} onchange="updTask(${task.id},'anki',this.checked)" style="accent-color:var(--pk)">Anki
      </label>
      <button class="btn btn-sm" onclick="delTask(${task.id})" style="color:#d05070;border-color:#fcc">Remover</button>
    </div>`;
  }

  let acts = "";
  if(isDone) {
    if(task.anki&&!isLogged) acts += `<button class="tc-btn tc-btn-anki" onclick="event.stopPropagation();openAnkiModal(${task.id})">Anki</button>`;
    if(task.anki&&isLogged) acts += `<span class="tc-btn tc-btn-anki logged">Anki OK</span>`;
    if(task.subj!=="Bem-estar") acts += `<button class="tc-btn tc-btn-quiz" onclick="event.stopPropagation();startQuizForTask(${task.id})">Quiz IA</button>`;
  }
  acts += `<button class="tc-btn tc-btn-note" onclick="event.stopPropagation();openNoteModal(${task.id})">${hasNote?"Ver nota":"Nota"}</button>`;
  acts += `<button class="tc-btn tc-btn-pomo" onclick="event.stopPropagation();go('pomodoro')">Pomo</button>`;

  const notePrev = hasNote ? `<div style="margin-top:5px;font-size:.71rem;font-style:italic;color:var(--mu);background:#f0f9ff;border-left:3px solid #38bdf8;border-radius:0 7px 7px 0;padding:3px 7px;line-height:1.5;word-break:break-word">${esc(tNotes[task.id].substring(0,80))}${tNotes[task.id].length>80?"...":""}</div>` : "";

  return `<div class="tc${isDone?" done":""}" onclick="toggleDone(${task.id})" style="border-left-color:${col}">
    <div class="tc-row">
      <div class="chk">${isDone?"v":""}</div>
      <div class="tc-body">
        <div class="tc-title">${esc(task.title)}</div>
        <div class="tc-tags">
          ${task.time?`<span class="tag t-time">${esc(task.time)}</span>`:""}
          ${task.subj?`<span class="tag" style="background:${col}22;border-color:${col};color:var(--tx)">${esc(task.subj)}</span>`:""}
          ${task.type?`<span class="tag t-type">${esc(task.type)}</span>`:""}
        </div>
        ${notePrev}
        <div class="tc-actions">${acts}</div>
      </div>
    </div>
  </div>`;
}

let pendingAnkiId = null, pendingNoteId = null;

function saveMood(label) { moodLog[todayStr()] = label; save(); render(); }

function quickAddDay(day) { openModal("addModal"); setTimeout(()=>{ document.getElementById("ntDay").value=day; document.getElementById("ntTitle").focus(); },100); }
function addTask() {
  const title = document.getElementById("ntTitle").value.trim();
  if(!title) return;
  tasks.push({id:nextId++,day:document.getElementById("ntDay").value,time:document.getElementById("ntTime").value.trim(),title,subj:document.getElementById("ntSubj").value.trim(),type:document.getElementById("ntType").value.trim(),anki:document.getElementById("ntAnki").checked});
  save(); closeModal("addModal"); render();
}
function updTask(id,f,v) { const t=tasks.find(x=>x.id===id); if(t){t[f]=v;save();} }
function delTask(id) { if(!window.confirm("Remover?"))return; tasks=tasks.filter(t=>t.id!==id); delete done[id]; delete tNotes[id]; ankiLogs=ankiLogs.filter(l=>l.taskId!==id); save(); render(); }

function openAnkiModal(id) {
  pendingAnkiId = id;
  const t = tasks.find(x=>x.id===id);
  document.getElementById("ankiTaskTitle").textContent = t?t.title:"";
  document.getElementById("ankiSubjIn").value = t?t.subj||"":"";
  openModal("ankiModal");
}
function confirmAnki() {
  if(!pendingAnkiId) return;
  const t = tasks.find(x=>x.id===pendingAnkiId);
  const subj = document.getElementById("ankiSubjIn").value.trim() || (t?t.subj:"") || "Geral";
  const d = new Date(); d.setHours(0,0,0,0);
  const reviews = SR.map(days=>{ const rd=new Date(d); rd.setDate(rd.getDate()+days); return {date:rd.toISOString().split("T")[0],done:false}; });
  ankiLogs.push({taskId:pendingAnkiId,subj,logDate:todayStr(),reviews});
  save(); checkAch(); closeModal("ankiModal"); render();
}
function openNoteModal(id) {
  pendingNoteId = id;
  const t = tasks.find(x=>x.id===id);
  document.getElementById("noteTaskTitle").textContent = t?t.title:"";
  document.getElementById("noteText").value = tNotes[id]||"";
  openModal("noteModal");
}
function saveNote() {
  const v = document.getElementById("noteText").value.trim();
  if(v) tNotes[pendingNoteId] = v; else delete tNotes[pendingNoteId];
  save(); closeModal("noteModal"); render();
}
function startQuizForTask(id) {
  const t = tasks.find(x=>x.id===id);
  if(t) { qSubj=t.subj||null; qTopics=[t.title]; }
  go("quiz");
}

function toggleSubj(s) { qSubj = qSubj===s?null:s; renderQuiz(); }
function addTopic() {
  const v = document.getElementById("topicInput").value.trim();
  if(v && !qTopics.includes(v)) { qTopics.push(v); document.getElementById("topicInput").value=""; renderQuiz(); }
}
function removeTopic(i) { qTopics.splice(i,1); renderQuiz(); }

async function generateQuiz() {
  const subj = qSubj||"Medicina Geral";
  const topicsStr = qTopics.length ? qTopics.join(", ") : "conteudo geral de "+subj;
  const dMap = {misto:"variada (facil, medio e dificil)",facil:"facil",medio:"media",dificil:"dificil"};
  const fMap = {misto:"misto (teorico e casos clinicos)",clinico:"apenas casos clinicos",direto:"teorico direto",aplicado:"aplicacao e fisiopatologia"};

  const prompt =
    "Voce e professor de medicina especialista em "+subj+". "+
    "Crie EXATAMENTE "+qN+" questoes de multipla escolha estilo ENARE/residencia sobre: "+topicsStr+". "+
    "Dificuldade: "+dMap[qDiff]+". Formato: "+fMap[qFmt]+". "+
    "5 alternativas (A,B,C,D,E), questoes clinicas especificas, explicacao didatica. "+
    "RESPONDA SOMENTE com JSON puro, sem markdown: "+
    '{"questions":[{"q":"enunciado","opts":{"A":"","B":"","C":"","D":"","E":""},"ans":"A","exp":"explicacao"}]}';

  document.getElementById("quizStatus").innerHTML = `
<div style="background:white;border-radius:16px;padding:30px 20px;text-align:center;box-shadow:var(--sh)">
  <div class="spin" style="font-size:1.8rem;margin-bottom:10px">*</div>
  <div style="font-size:.95rem;color:var(--mu);font-style:italic">Gerando questoes de nivel medico...</div>
</div>`;

  try {
    // *** CHAMA O BACKEND NETLIFY — NAO O ANTHROPIC DIRETAMENTE ***
    const res = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        max_tokens: 6000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if(!res.ok) {
      const err = await res.text();
      throw new Error("Erro HTTP "+res.status+": "+err.slice(0,150));
    }

    const data = await res.json();
    const blocks = Array.isArray(data.content) ? data.content : [];
    let raw = blocks.filter(b=>b&&b.type==="text").map(b=>b.text).join("").trim();
    raw = raw.replace(/^```[\w]*\s*/i,"").replace(/\s*```\s*$/i,"").trim();
    const a=raw.indexOf("{"), b=raw.lastIndexOf("}");
    if(a<0||b<0) throw new Error("JSON nao encontrado na resposta.");
    const parsed = JSON.parse(raw.slice(a,b+1));
    const qs = Array.isArray(parsed.questions) ? parsed.questions : [];
    if(!qs.length) throw new Error("Nenhuma questao retornada.");
    curQuiz = qs; quizAns = {};
    renderQuizQuestions();
  } catch(e) {
    document.getElementById("quizStatus").innerHTML = `
<div style="background:#fff5f5;border:1.5px solid #fca5a5;border-radius:16px;padding:16px;margin-bottom:16px">
  <div style="font-weight:700;color:var(--red);margin-bottom:6px">Erro ao gerar questoes</div>
  <div style="font-size:.82rem;color:#b91c1c;word-break:break-word;margin-bottom:12px">${esc(String(e.message||e))}</div>
  <button class="btn btn-pk btn-sm" onclick="generateQuiz()">Tentar novamente</button>
</div>`;
  }
}

function renderQuizQuestions() {
  const answered = Object.keys(quizAns).length;
  const correct = answered ? Object.entries(quizAns).filter(([i,a])=>a===curQuiz[+i].ans).length : 0;
  const allDone = curQuiz.length>0 && answered===curQuiz.length;
  const pct = answered ? Math.round(correct/answered*100) : 0;

  let html = `
<div class="page-title">Quiz IA</div>
<div class="page-sub">${qSubj||"Medicina"} — ${qTopics.length?qTopics.join(", "):"Geral"}</div>
<div class="score-bar">
  <span style="font-size:.82rem;font-weight:700;color:var(--pkd);white-space:nowrap">${correct}/${answered} corretas</span>
  <div style="flex:1;height:10px;background:var(--pk1);border-radius:99px;overflow:hidden">
    <div style="height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pk3),var(--pk));width:${pct}%;transition:width .5s"></div>
  </div>
  <span style="font-size:.82rem;font-weight:700;color:var(--pk);white-space:nowrap">${pct}%</span>
</div>`;

  curQuiz.forEach((q,i) => {
    const ua = quizAns[i];
    const isAns = ua !== undefined;
    html += `<div class="q-block">
      <div class="q-num">Questao ${i+1} de ${curQuiz.length}</div>
      <div class="q-text">${esc(q.q)}</div>
      <div class="q-opts">
        ${Object.entries(q.opts).map(([l,t]) => {
          let cls = "q-opt";
          if(isAns) {
            if(l===ua) cls += l===q.ans?" correct":" wrong";
            else if(l===q.ans) cls += " rev";
          }
          return `<button class="${cls}" onclick="pickAnswer(${i},'${l}')" ${isAns?"disabled":""}>
            <span style="font-weight:700;flex-shrink:0;min-width:16px">${l}</span>
            <span>${esc(t)}</span>
          </button>`;
        }).join("")}
      </div>
      ${isAns?`<div class="q-expl show">${esc(q.exp)}</div>`:""}
    </div>`;
  });

  if(allDone) {
    html += `<div class="quiz-result">
      <div class="qr-score">${correct}/${curQuiz.length}</div>
      <div style="font-size:.85rem;color:var(--mu);margin-top:4px">${Math.round(correct/curQuiz.length*100)}% de acertos</div>
      <div style="font-size:.9rem;font-style:italic;color:var(--tx);margin-top:10px;line-height:1.6">
        ${correct===curQuiz.length?"Perfeito! Voce dominou esse conteudo!":
          correct>=curQuiz.length*.8?"Excelente desempenho!":
          correct>=curQuiz.length*.6?"Bom! Revise os erros com cuidado.":
          "Continue estudando! Os erros mostram onde focar."}
      </div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-pk" onclick="curQuiz=[];quizAns={};renderQuiz()">Novo Quiz</button>
        <button class="btn btn-gh" onclick="curQuiz=[];quizAns={};qTopics=[];qSubj=null;renderQuiz()">Reconfigurar</button>
      </div>
    </div>`;
  }

  document.getElementById("mainContent").innerHTML = html;
}

function pickAnswer(qi, letter) {
  if(quizAns[qi]!==undefined) return;
  quizAns[qi] = letter;
  if(letter !== curQuiz[qi].ans) {
    wrongQ.unshift({subj:qSubj||"Geral",q:curQuiz[qi].q,correct:curQuiz[qi].ans,correctText:curQuiz[qi].opts[curQuiz[qi].ans],date:todayStr()});
    wrongQ = wrongQ.slice(0,30);
  }
  if(Object.keys(quizAns).length === curQuiz.length) {
    const c = Object.values(quizAns).filter((a,i)=>a===curQuiz[i].ans).length;
    quizDone++; if(c===curQuiz.length) quizPerf++;
    quizHist.push({date:todayStr(),subj:qSubj||"Geral",correct:c,total:curQuiz.length});
    quizHist = quizHist.slice(-50);
    save(); checkAch();
  }
  renderQuizQuestions();
  setTimeout(()=>{ const el=document.querySelectorAll(".q-block")[qi]; if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"}); },50);
}

  const taskBySubj = {};

${Object.keys(bySubj).length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px;margin-bottom:16px">
  ${Object.entries(bySubj).map(([subj,v],i)=>{const r=Math.round(v.c/v.t*100);const c=r>=70?"var(--mint)":r>=50?"var(--gold)":"var(--red)";return`<div class="card" style="border-top:3px solid ${ACC[i%ACC.length]}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><div style="font-size:.84rem;font-weight:700;color:var(--tx)">${subj}</div><div style="font-size:.82rem;font-weight:700;color:${c}">${r}%</div></div>
    <div style="height:7px;background:var(--pk1);border-radius:99px;overflow:hidden"><div style="height:100%;border-radius:99px;background:${c};width:${r}%;transition:width .5s"></div></div>

</div>`:""}
<div class="sec-title">Progresso por Materia</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-bottom:16px">
  ${Object.entries(taskBySubj).map(([subj,v])=>{const r=v.total?Math.round(v.done/v.total*100):0;const col=sCol(subj);return`<div class="card" style="border-left:4px solid ${col}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px"><div style="font-size:.85rem;font-weight:700;color:var(--tx)">${subj}</div><div style="font-size:.8rem;font-weight:700;color:var(--pk)">${r}%</div></div>
    <div style="height:8px;background:var(--pk1);border-radius:99px;overflow:hidden;margin-bottom:4px"><div style="height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pk3),var(--pk));width:${r}%;transition:width .5s"></div></div>
    <div style="font-size:.68rem;color:var(--mu)">${v.done}/${v.total} tarefas concluidas</div>

${wrongQ.length===0?`<div style="color:var(--mu);font-size:.82rem;padding:10px;text-align:center">Nenhum erro registrado — continue assim!</div>`:

  const todaySess = pomoSess.filter(s=>s.date===td);
  const pending = tasks.filter(t=>!done[t.id]);

  document.getElementById("mainContent").innerHTML = `

<div class="page-sub">25 min foco, 5 min pausa</div>
<div class="pomo-card${pomoRunning?(pomoPhase==="break"?" break-mode":" focus-mode"):""}">
  <div style="position:relative;width:134px;height:134px;margin:0 auto 11px">
    <svg width="134" height="134" viewBox="0 0 134 134" style="transform:rotate(-90deg)">
      <circle cx="67" cy="67" r="55" fill="none" stroke="var(--pk1)" stroke-width="9"/>
      <circle cx="67" cy="67" r="55" fill="none" stroke="url(#pg2)" stroke-width="9"

        <stop offset="100%" stop-color="var(--pk)"/>
      </linearGradient></defs>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:1.8rem;font-weight:700;color:var(--pk);font-variant-numeric:tabular-nums;line-height:1">${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</div>
      <div style="font-size:.66rem;color:var(--mu);margin-top:2px;letter-spacing:1px;text-transform:uppercase">${pomoPhase==="focus"?"FOCO":"PAUSA"}</div>
    </div>
  </div>
  <div style="display:flex;justify-content:center;gap:7px;margin-bottom:11px">
    ${Array.from({length:4},(_,i)=>`<div style="width:8px;height:8px;border-radius:50%;background:${i<pomoCycle?"var(--pk)":"var(--pk2)"};transition:background .3s"></div>`).join("")}
  </div>
  <select onchange="pomoSel=this.value" style="max-width:270px;margin:0 auto 10px;display:block;border:1.5px solid var(--bd);border-radius:10px;padding:7px 10px;font-family:'DM Sans',sans-serif;font-size:.84rem;color:var(--tx);background:#fff5f9;outline:none;width:100%">

  </select>
  <div style="display:flex;justify-content:center;gap:7px;flex-wrap:wrap">
    <button class="btn btn-pk" onclick="pomoToggle()">${pomoRunning?"Pausar":"Iniciar"}</button>

    <button class="btn btn-gh btn-sm" onclick="pomoSkip()">Pular</button>
  </div>
</div>
<div class="card">
  <div style="font-size:.78rem;font-weight:600;color:var(--mu);margin-bottom:7px">Sessoes de hoje</div>
  ${todaySess.length===0?`<div style="font-size:.78rem;color:var(--mu)">Nenhuma sessao ainda</div>`:
    todaySess.map(s=>`<div style="display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid var(--pk1)">
      <span>${s.tp==="focus"?"[F]":"[P]"}</span>

function pomoToggle() {
  if(pomoRunning) {
    clearInterval(pomoTimer); pomoTimer=null; pomoRunning=false;
  } else {
    pomoRunning=true;
    pomoTimer = setInterval(() => {
      pomoSec--;
      if(pomoSec <= 0) {
        clearInterval(pomoTimer); pomoTimer=null; pomoRunning=false;
        const tp=pomoPhase, task=tasks.find(t=>t.id===parseInt(pomoSel));
        pomoSess.push({date:todayStr(),task:task?task.title:"Foco geral",tp});
        pomoPhase = tp==="focus"?"break":"focus";
        if(tp==="focus") pomoCycle++;
        pomoSec = pomoPhase==="focus"?25*60:5*60;
        save(); checkAch();
      }
      if(curPage==="pomodoro") renderPomodoro();
    }, 1000);
  }
  if(curPage==="pomodoro") renderPomodoro();
}
function pomoReset() { clearInterval(pomoTimer); pomoTimer=null; pomoRunning=false; pomoSec=25*60; pomoPhase="focus"; pomoCycle=0; if(curPage==="pomodoro")renderPomodoro(); }

function renderHistorico() {

  const days=168;const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-days);
  const cells=[];for(let i=0;i<=days;i++){const d=new Date(start);d.setDate(d.getDate()+i);const ds=d.toISOString().split("T")[0];cells.push({date:ds,count:studyLog[ds]||0,isToday:ds===td});}

      ${weeks.map(week=>`<div style="display:flex;flex-direction:column;gap:3px">
        ${Array.from({length:7},(_,di)=>{const cell=week[di];if(!cell)return`<div style="width:11px;height:11px"></div>`;const lvl=cell.count===0?0:cell.count<=1?1:cell.count<=2?2:cell.count<=4?3:cell.count<=6?4:5;return`<div style="width:11px;height:11px;border-radius:2px;background:${lvlCol[lvl]};${cell.isToday?"outline:2px solid var(--pk);outline-offset:1px;":""}" title="${cell.date}: ${cell.count} tarefas"></div>`;}).join("")}
      </div>`).join("")}
    </div>
  </div>
</div>
<div class="stats-grid">
  ${[{n:strk,l:"Sequencia"},{n:Object.keys(studyLog).length,l:"Dias"},{n:Object.values(done).filter(Boolean).length,l:"Tarefas"},{n:pomoSess.filter(s=>s.date===td&&s.tp==="focus").length,l:"Pomodoros"},{n:quizDone,l:"Quizzes"}].map(s=>`

</div>

`<div style="display:flex;gap:4px;flex-wrap:wrap">

</div>`}`;
}

// ─── BACKGROUND CANVAS ────────────────────────────────────────────────────
(function(){
  const cv=document.getElementById("bgCanvas"),cx=cv.getContext("2d");
  let W,H,items=[];
  const SH=["rgba(255,182,215,","rgba(255,150,193,","rgba(236,72,153,","rgba(255,214,232,","rgba(252,231,243,"];
  const resize=()=>{W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;};
  const heart=(x,y,s,a,c)=>{cx.save();cx.globalAlpha=a;cx.fillStyle=c;cx.beginPath();cx.moveTo(x,y+s*.3);cx.bezierCurveTo(x,y,x-s,y,x-s,y-s*.4);cx.bezierCurveTo(x-s,y-s,x,y-s,x,y-s*.5);cx.bezierCurveTo(x,y-s,x+s,y-s,x+s,y-s*.4);cx.bezierCurveTo(x+s,y,x,y,x,y+s*.3);cx.fill();cx.restore();};
  const flower=(x,y,s,a,c)=>{cx.save();cx.globalAlpha=a;for(let i=0;i<5;i++){const ag=(i/5)*Math.PI*2,px=x+Math.cos(ag)*s*.55,py=y+Math.sin(ag)*s*.55;cx.fillStyle=c;cx.beginPath();cx.ellipse(px,py,s*.44,s*.27,ag,0,Math.PI*2);cx.fill();}cx.fillStyle="#fff5f9";cx.beginPath();cx.arc(x,y,s*.24,0,Math.PI*2);cx.fill();cx.restore();};
  const bow=(x,y,s,a,c)=>{cx.save();cx.globalAlpha=a;cx.fillStyle=c;cx.beginPath();cx.moveTo(x,y);cx.bezierCurveTo(x-s*.3,y-s*.6,x-s,y-s*.5,x-s,y-s*.1);cx.bezierCurveTo(x-s,y+s*.4,x-s*.3,y+s*.3,x,y);cx.fill();cx.beginPath();cx.moveTo(x,y);cx.bezierCurveTo(x+s*.3,y-s*.6,x+s,y-s*.5,x+s,y-s*.1);cx.bezierCurveTo(x+s,y+s*.4,x+s*.3,y+s*.3,x,y);cx.fill();cx.fillStyle="#ec4899";cx.globalAlpha=Math.min(1,a*1.3);cx.beginPath();cx.arc(x,y,s*.16,0,Math.PI*2);cx.fill();cx.restore();};
  const mk=()=>{const tp=["heart","heart","flower","bow"];return{tp:tp[Math.floor(Math.random()*tp.length)],x:Math.random()*W,y:Math.random()*H,s:7+Math.random()*15,a:.04+Math.random()*.08,col:SH[Math.floor(Math.random()*SH.length)]+"1)",sp:.09+Math.random()*.18,dr:(Math.random()-.5)*.11,ph:Math.random()*Math.PI*2};};
  const draw=(t)=>{
    const g=cx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#ffd6e8");g.addColorStop(.5,"#ffb3d1");g.addColorStop(1,"#ffd6e8");cx.fillStyle=g;cx.fillRect(0,0,W,H);
    items.forEach(it=>{const wb=Math.sin(t*.001+it.ph)*2,x=it.x+wb;if(it.tp==="heart")heart(x,it.y,it.s,it.a,it.col);else if(it.tp==="flower")flower(x,it.y,it.s,it.a,it.col);else bow(x,it.y,it.s,it.a,it.col);it.y-=it.sp;it.x+=it.dr;if(it.y<-40){it.y=H+30;it.x=Math.random()*W;}if(it.x<-40)it.x=W+30;if(it.x>W+40)it.x=-30;});
    requestAnimationFrame(draw);
  };
  window.addEventListener("resize",resize);resize();items=Array.from({length:52},mk);requestAnimationFrame(draw);
})();
